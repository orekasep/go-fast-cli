name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: linux-amd64
            ext: ""
          - os: linux
            arch: arm64
            suffix: linux-arm64
            ext: ""
          - os: darwin
            arch: amd64
            suffix: darwin-amd64
            ext: ""
          - os: darwin
            arch: arm64
            suffix: darwin-arm64
            ext: ""
          - os: windows
            arch: amd64
            suffix: windows-amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            suffix: windows-arm64
            ext: ".exe"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build and Archive
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          BINARY_NAME="fast${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "${BINARY_NAME}" .
          
          ARCHIVE_NAME="go-fast-cli_${{ github.ref_name }}_${{ matrix.suffix }}"
          mkdir -p "${ARCHIVE_NAME}"
          mv "${BINARY_NAME}" "${ARCHIVE_NAME}/"
          cp README.md "${ARCHIVE_NAME}/"
          
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          else
            tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.suffix }}
          path: |
            *.tar.gz
            *.zip

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
